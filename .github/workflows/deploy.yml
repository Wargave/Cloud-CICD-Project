name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Проверка и сборка проекта
    runs-on: ubuntu-latest
    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Проверка обязательных файлов проекта
        run: |
          for file in index.html style.css script.js; do
            if [ ! -s "$file" ]; then
              echo "Ошибка: файл $file отсутствует или пуст!"
              exit 1
            fi
          done
          grep -q "<html" index.html && echo "Проверка HTML пройдена успешно."

      - name: Настройка GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузка артефакта для публикации
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    name: Публикация на GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Развёртывание на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4